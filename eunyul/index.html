<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은율이의 중간고사</title>
<style>
  :root { --bad: #e74c3c; --accent: #667eea; --accent-soft: #eeeaff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    color: #333;
    word-break: keep-all;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    width: 100%;
    max-width: 560px;
    margin: auto 0;
    padding: 32px 28px;
  }
  h1 { font-size: 1.5rem; color: #4a3b8c; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #888; font-size: .9rem; margin-bottom: 24px; }

  /* 시작 화면 */
  .lesson-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
  .unit-head {
    display: flex; align-items: center; gap: 8px; padding: 6px 2px 2px;
    font-weight: 800; color: #4a3b8c; font-size: .92rem; cursor: pointer; user-select: none;
  }
  .unit-head input { width: 16px; height: 16px; accent-color: #667eea; cursor: pointer; }
  .unit-head .unit-count { margin-left: auto; color: #b3a5e8; font-size: .8rem; font-weight: 600; }
  .range-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .range-head .section-label { margin-bottom: 0; }
  .btn-toggle-all { background: none; color: #8b7cc8; font-size: .78rem; padding: 4px 8px; font-weight: 600; }
  .btn-toggle-all:hover { color: #4a3b8c; }
  .btn-review {
    width: 100%; padding: 13px; color: #fff;
    background: linear-gradient(135deg, #f2994a, #f2c94c);
  }
  .btn-review:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(242,153,74,.4); }
  .review-hint { font-size: .78rem; color: #b08968; margin-top: 8px; text-align: center; }
  .lesson-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .lesson-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .lesson-item input { width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; flex-shrink: 0; }
  .lesson-item .name { font-weight: 600; color: #333; }
  .lesson-item .count { margin-left: auto; color: #999; font-size: .85rem; white-space: nowrap; }
  .option-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    padding: 10px 16px; background: #f5f3fc; border-radius: 10px;
    cursor: pointer; user-select: none;
  }
  .option-row input { accent-color: #667eea; width: 16px; height: 16px; cursor: pointer; }
  .option-row span { font-size: .9rem; color: #555; }
  .mode-list { display: flex; gap: 10px; margin-bottom: 16px; }
  .mode-item {
    flex: 1; display: flex; flex-direction: column; gap: 4px;
    padding: 12px 14px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none; text-align: center;
  }
  .mode-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .mode-item.selected { border-color: #667eea; background: #f3f0ff; }
  .mode-item input { display: none; }
  .mode-item .mode-name { font-weight: 700; color: #4a3b8c; }
  .mode-item .mode-desc { font-size: .78rem; color: #999; }
  .section-label { font-size: .85rem; font-weight: 700; color: #777; margin-bottom: 8px; }
  .count-list { display: flex; gap: 8px; margin-bottom: 6px; }
  .count-item {
    flex: 1; padding: 10px 6px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none; text-align: center;
  }
  .count-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .count-item.selected { border-color: #667eea; background: #f3f0ff; }
  .count-item input { position: absolute; opacity: 0; pointer-events: none; }
  .count-item:has(input:focus-visible) { outline: 3px solid #a78bfa; outline-offset: 2px; }
  .count-name { font-weight: 700; color: #4a3b8c; font-size: .95rem; }
  .count-hint { font-size: .78rem; color: #b08968; min-height: 18px; margin-bottom: 10px; text-align: center; }

  /* 실시간 점수 */
  .score-line { display: flex; gap: 16px; justify-content: center; margin-bottom: 14px; font-weight: 700; font-size: .95rem; }
  .score-line .sc-ok { color: #27ae60; }
  .score-line .sc-no { color: #e74c3c; }

  /* 해설 */
  .answer-reveal { margin-top: 18px; background: #f7f5ff; border-radius: 14px; padding: 18px 20px; }
  .answer-label { font-size: .8rem; color: #8b7cc8; font-weight: 700; margin-bottom: 6px; }
  .explain-text { font-size: .93rem; color: #444; line-height: 1.7; white-space: pre-wrap; }

  /* 시험 기록 */
  .history-section { margin-top: 24px; }
  .history-title { font-size: .9rem; font-weight: 700; color: #666; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .btn-clear-history { background: none; color: #bbb; font-size: .75rem; padding: 4px 8px; }
  .btn-clear-history:hover { color: #e74c3c; }
  .btn-clear-history.armed { color: #e74c3c; }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
  .history-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #f7f5ff; border-radius: 10px; font-size: .82rem; flex-wrap: wrap; }
  .history-item .h-mode { font-weight: 700; color: #4a3b8c; white-space: nowrap; }
  .history-item .h-score { font-weight: 700; color: #333; white-space: nowrap; }
  .history-item .h-range { color: #999; }
  .history-item .h-date { color: #bbb; margin-left: auto; white-space: nowrap; }
  .history-empty { text-align: center; color: #bbb; font-size: .85rem; padding: 12px; }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 600; transition: all .15s;
  }
  button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
  .btn-primary {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,.4); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* 퀴즈 화면 */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .round-badge {
    background: #eef; color: #556; font-size: .8rem; font-weight: 700;
    padding: 4px 12px; border-radius: 999px;
  }
  .round-badge.retry { background: #fde8e8; color: #c0392b; }
  .btn-restart {
    background: #f0f0f0; color: #666; padding: 6px 14px; font-size: .82rem;
  }
  .btn-restart:hover { background: #e0e0e0; }
  .btn-restart.armed { background: #fde8e8; color: #c0392b; }
  .progress-track { background: #eee; border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, #667eea, #a78bfa); transition: width .3s;
  }
  .progress-text { font-size: .8rem; color: #999; text-align: right; margin-bottom: 18px; }

  .q-box { margin-bottom: 20px; }
  .q-meta { display: flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 700; color: #8b7cc8; margin-bottom: 10px; }
  .subj-chip { color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .78rem; }
  .passage {
    background: #f7f5ff; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
    font-size: .93rem; line-height: 1.7; color: #333; white-space: pre-wrap; overflow-x: auto;
  }
  .fig { text-align: center; color: #2d2456; white-space: normal; }
  .question { font-size: 1.12rem; font-weight: 800; color: #2d2456; line-height: 1.55; white-space: pre-wrap; }
  .word-hint { font-size: .85rem; color: #aaa; margin-top: 8px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    padding: 13px 16px; border: 2px solid #e5e0f5; border-radius: 12px;
    background: #fff; font-size: 1rem; text-align: left; color: #333;
    display: flex; align-items: flex-start; gap: 12px; line-height: 1.45;
  }
  .choice .txt { white-space: pre-wrap; }
  .choice .num {
    background: #f0edfb; color: #7c6bd0; font-size: .8rem; font-weight: 700;
    width: 24px; height: 24px; border-radius: 6px; margin-top: 1px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .choice:hover:not(:disabled) { border-color: #a78bfa; background: #faf8ff; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: #27ae60; background: #eafaf1; color: #1e8449; font-weight: 700; }
  .choice.correct .num { background: #27ae60; color: #fff; }
  .choice.wrong { border-color: #e74c3c; background: #fdedec; color: #c0392b; }
  .choice.wrong .num { background: #e74c3c; color: #fff; }
  .choice.dim { opacity: .45; }

  .feedback { text-align: center; margin-top: 18px; min-height: 30px; font-weight: 700; font-size: 1.05rem; }
  .feedback.ok { color: #27ae60; }
  .feedback.no { color: #e74c3c; }

  .btn-next { width: 100%; padding: 14px; margin-top: 14px; background: #4a3b8c; color: #fff; }
  .btn-next:hover { background: #5c4bad; }

  /* 결과 화면 */
  .result-emoji { font-size: 4rem; text-align: center; margin-bottom: 12px; }
  .result-title { text-align: center; font-size: 1.4rem; font-weight: 800; color: #2d2456; margin-bottom: 20px; }
  .stats { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat {
    flex: 1; background: #f7f5ff; border-radius: 14px; padding: 16px 8px; text-align: center;
  }
  .stat .val { font-size: 1.6rem; font-weight: 800; color: #4a3b8c; }
  .stat .label { font-size: .78rem; color: #999; margin-top: 4px; }
  .wrong-list-title { font-size: .9rem; font-weight: 700; color: #666; margin-bottom: 10px; }
  .wrong-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; max-height: 260px; overflow-y: auto; }
  .wrong-item {
    display: flex; flex-direction: column; gap: 3px; padding: 10px 14px;
    background: #fdf5f5; border-radius: 10px; font-size: .92rem;
  }
  .wrong-item .top { display: flex; justify-content: space-between; gap: 8px; }
  .wrong-item .en { font-weight: 700; color: #b03a2e; }
  .wrong-item .ko { color: #666; font-size: .85rem; }
  .wrong-item .cnt { color: #d98880; font-size: .8rem; white-space: nowrap; }
  .perfect-msg { text-align: center; color: #27ae60; font-weight: 600; margin-bottom: 22px; }

  @media (max-width: 480px) {
    .card { padding: 24px 18px; }
    .stats { flex-wrap: wrap; }
    .stat { flex: 1 1 40%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const SUBJECTS = ['국어', '영어', '수학', '과학'];
const SUBJECT_COLORS = { 국어: '#e67e22', 영어: '#4a90e2', 수학: '#27ae60', 과학: '#8e44ad' };

const ALL_Q = [];
SUBJECTS.forEach(s => (QUESTIONS[s] || []).forEach((q, i) => ALL_Q.push({ ...q, subject: s, id: `${s}-${i}` })));

// 단원(topic) 목록: 과목 안에서 처음 나온 순서대로
const TOPICS = [];
ALL_Q.forEach(q => {
  let t = TOPICS.find(x => x.subject === q.subject && x.topic === q.topic);
  if (!t) { t = { subject: q.subject, topic: q.topic, qs: [] }; TOPICS.push(t); }
  t.qs.push(q);
});

// ===== 상태 =====
let state = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function shorten(s, n) {
  const one = s.replace(/\s+/g, " ");
  return one.length > n ? one.slice(0, n) + "…" : one;
}

const app = document.getElementById("app");

// ===== 저장소 (localStorage) =====
function storeGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || fallback); }
  catch (e) { return JSON.parse(fallback); }
}
function storeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function storeRemove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

// 확인창 대신 "한 번 더 누르기"로 확인
function armButton(btn, armedText, action) {
  btn.addEventListener("click", () => {
    if (btn.classList.contains("armed")) { action(); return; }
    const original = btn.textContent;
    btn.classList.add("armed");
    btn.textContent = armedText;
    setTimeout(() => {
      if (document.body.contains(btn)) { btn.classList.remove("armed"); btn.textContent = original; }
    }, 3000);
  });
}

// ===== 시험 기록 =====
const MODE_LABELS = { study: "📖 기본", real: "🔥 실전" };
const HISTORY_KEY = "eunyul-quiz-history";

function loadHistory() { return storeGet(HISTORY_KEY, "[]"); }
function saveHistoryEntry(entry) {
  const h = loadHistory();
  h.unshift(entry);
  storeSet(HISTORY_KEY, h.slice(0, 50));
}
function fmtDate(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
}
function historyHTML() {
  const h = loadHistory();
  return `
    <div class="history-section">
      <div class="history-title">
        <span>📜 시험 기록</span>
        ${h.length ? `<button class="btn-clear-history" id="btn-clear-history">기록 지우기</button>` : ""}
      </div>
      ${h.length ? `<div class="history-list">
        ${h.map(e => `
          <div class="history-item">
            <span class="h-mode">${MODE_LABELS[e.mode] || e.mode}</span>
            <span class="h-score">${e.accuracy}% · ⭕${e.correct} ❌${e.attempts - e.correct}</span>
            <span class="h-range">${escapeHtml(e.range)}</span>
            <span class="h-date">${fmtDate(e.date)}</span>
          </div>`).join("")}
      </div>`
      : `<div class="history-empty">아직 시험 기록이 없어요. 첫 시험을 쳐 보세요!</div>`}
    </div>`;
}

// ===== 오답 통계 (누적) =====
const WRONG_STATS_KEY = "eunyul-wrong-stats";

function loadWrongStats() { return storeGet(WRONG_STATS_KEY, "{}"); }
function bumpWrongStat(id, delta) {
  const stats = loadWrongStats();
  const next = (stats[id] || 0) + delta;
  if (next <= 0) delete stats[id];
  else stats[id] = next;
  storeSet(WRONG_STATS_KEY, stats);
}
// 자주 틀리는 문제: 많이 틀린 순, 최대 20개
function reviewQuestions() {
  const stats = loadWrongStats();
  return ALL_Q.filter(q => stats[q.id] > 0)
    .sort((a, b) => stats[b.id] - stats[a.id])
    .slice(0, 20);
}

// ===== 퀴즈 시작 =====
function startQuiz(questions, mode, range, isReview) {
  state = {
    mode: mode || "study",
    range: range || "전체",
    isReview: !!isReview,
    totalQuestions: questions.length,
    round: 1,
    queue: shuffle(questions),
    idx: 0,
    wrongThisRound: [],
    totalAttempts: 0,
    totalCorrect: 0,
    wrongCount: {},   // id -> 틀린 횟수
    answered: false
  };
  renderQuestion();
}

function currentQ() { return state.queue[state.idx]; }

// ===== 문제 화면 =====
function renderQuestion() {
  const q = currentQ();
  state.answered = false;
  state.opts = shuffle(q.options.map((t, i) => ({ t, ok: i === q.answer })));

  const progress = (state.idx / state.queue.length) * 100;
  const isRetry = state.round > 1;

  app.innerHTML = `
    <div class="top-bar">
      <span class="round-badge ${isRetry ? "retry" : ""}">
        ${isRetry ? `🔁 오답 다시 풀기 (${state.round}차)` : "1차 시험"}
      </span>
      <button class="btn-restart" id="btn-restart">⟲ 처음부터</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${state.idx + 1} / ${state.queue.length}</div>
    <div class="score-line">
      <span class="sc-ok">⭕ 맞음 ${state.totalCorrect}</span>
      <span class="sc-no">❌ 틀림 ${state.totalAttempts - state.totalCorrect}</span>
    </div>
    <div class="q-box">
      <div class="q-meta">
        <span class="subj-chip" style="background:${SUBJECT_COLORS[q.subject]}">${q.subject}</span>
        <span>${escapeHtml(q.topic)}</span>
      </div>
      ${(q.passage || q.fig) ? `<div class="passage">${q.passage ? escapeHtml(q.passage) : ""}${q.fig ? `<div class="fig">${q.fig}</div>` : ""}</div>` : ""}
      <div class="question">${escapeHtml(q.q)}</div>
      <div class="word-hint">알맞은 답을 고르세요 (키보드 1~${state.opts.length})</div>
    </div>
    <div class="choices">
      ${state.opts.map((o, i) => `
        <button class="choice" data-i="${i}">
          <span class="num">${i + 1}</span><span class="txt">${escapeHtml(o.t)}</span>
        </button>`).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <div id="explain-area"></div>
  `;

  armButton(document.getElementById("btn-restart"), "한 번 더 누르면 처음으로", renderStart);
  app.querySelectorAll(".choice").forEach(btn =>
    btn.addEventListener("click", () => answer(parseInt(btn.dataset.i)))
  );
  window.scrollTo(0, 0);
}

// ===== 답변 처리 =====
function answer(i) {
  if (state.answered) return;
  state.answered = true;

  const q = currentQ();
  const correct = state.opts[i].ok;
  const correctNo = state.opts.findIndex(o => o.ok) + 1;

  state.totalAttempts++;
  if (correct) {
    state.totalCorrect++;
    if (state.round === 1 && state.isReview) bumpWrongStat(q.id, -1); // 복습에서 맞히면 통계 감소
  } else {
    state.wrongThisRound.push(q);
    state.wrongCount[q.id] = (state.wrongCount[q.id] || 0) + 1;
    if (state.round === 1) bumpWrongStat(q.id, +1); // 오답 통계 누적 (오답 라운드는 제외)
  }

  const btns = [...app.querySelectorAll(".choice")];
  btns.forEach((b, j) => {
    b.disabled = true;
    if (state.opts[j].ok) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (correct ? "ok" : "no");
  fb.textContent = correct ? "⭕ 정답입니다!" : `❌ 틀렸어요! 정답: ${correctNo}번`;

  // 기본 모드이거나, 오답 다시 풀기 라운드면 해설 보여주기
  const area = document.getElementById("explain-area");
  if (state.mode === "study" || state.round > 1) {
    area.innerHTML = `
      <div class="answer-reveal">
        <div class="answer-label">💡 해설</div>
        <div class="explain-text">${escapeHtml(q.explain)}</div>
      </div>`;
  }

  const next = document.createElement("button");
  next.className = "btn-next";
  next.id = "btn-next";
  const isLast = state.idx === state.queue.length - 1;
  next.textContent = isLast && state.wrongThisRound.length === 0 ? "결과 보기 →" : "다음 문제 → (Enter)";
  next.addEventListener("click", nextQuestion);
  area.appendChild(next);
  next.focus({ preventScroll: true });
}

function nextQuestion() {
  state.idx++;
  if (state.idx < state.queue.length) {
    renderQuestion();
  } else if (state.wrongThisRound.length > 0) {
    // 오답 라운드 시작
    state.round++;
    state.queue = shuffle(state.wrongThisRound);
    state.wrongThisRound = [];
    state.idx = 0;
    renderQuestion();
  } else {
    renderResult();
  }
}

// ===== 결과 화면 =====
function renderResult() {
  const wrongEntries = Object.entries(state.wrongCount)
    .sort((a, b) => b[1] - a[1]);
  const accuracy = state.totalAttempts
    ? Math.round((state.totalCorrect / state.totalAttempts) * 100) : 0;
  const perfect = wrongEntries.length === 0;

  saveHistoryEntry({
    date: Date.now(),
    mode: state.mode,
    range: state.range,
    questions: state.totalQuestions,
    attempts: state.totalAttempts,
    correct: state.totalCorrect,
    accuracy,
    rounds: state.round
  });

  app.innerHTML = `
    <div class="result-emoji">${perfect ? "🏆" : accuracy >= 80 ? "🎉" : "💪"}</div>
    <div class="result-title">${perfect ? "완벽해요! 한 번에 다 맞혔어요!" : "모든 문제를 다 맞혔어요!"}</div>
    <div class="stats">
      <div class="stat"><div class="val" style="color:#27ae60">${state.totalCorrect}</div><div class="label">⭕ 맞음</div></div>
      <div class="stat"><div class="val" style="color:#e74c3c">${state.totalAttempts - state.totalCorrect}</div><div class="label">❌ 틀림</div></div>
      <div class="stat"><div class="val">${accuracy}%</div><div class="label">정답률</div></div>
      <div class="stat"><div class="val">${state.round}</div><div class="label">라운드</div></div>
    </div>
    ${perfect
      ? `<p class="perfect-msg">틀린 문제가 하나도 없어요 👏</p>`
      : `<div class="wrong-list-title">📌 틀렸던 문제 (복습하세요!)</div>
         <div class="wrong-list">
           ${wrongEntries.map(([id, cnt]) => {
             const q = ALL_Q.find(x => x.id === id);
             return `<div class="wrong-item">
               <div class="top"><span class="en">${q.subject} · ${escapeHtml(q.topic)}</span><span class="cnt">${cnt}회 틀림</span></div>
               <span class="ko">${escapeHtml(shorten(q.q, 60))}</span>
             </div>`;
           }).join("")}
         </div>`}
    <button class="btn-primary" id="btn-again">처음부터 다시 하기</button>
  `;
  document.getElementById("btn-again").addEventListener("click", renderStart);
  window.scrollTo(0, 0);
}

// ===== 키보드 단축키 =====
document.addEventListener("keydown", e => {
  if (!state.queue) return;
  const n = state.opts ? state.opts.length : 0;
  if (e.key >= "1" && e.key <= String(n) && !state.answered) {
    answer(parseInt(e.key) - 1);
  } else if (e.key === "Enter" && state.answered) {
    const btn = document.getElementById("btn-next");
    if (btn && document.activeElement !== btn) nextQuestion();
  }
});

renderStart();
</script>
</body>
</html>
