<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은율이의 중간고사</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    color: #333;
    word-break: keep-all;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    width: 100%;
    max-width: 640px;
    margin: auto 0;
    padding: 32px 28px;
  }
  h1 { font-size: 1.5rem; color: #4a3b8c; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #888; font-size: .9rem; margin-bottom: 24px; }

  /* 시작 화면 */
  .lesson-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .range-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .range-head .section-label { margin-bottom: 0; }
  .btn-toggle-all { background: none; color: #8b7cc8; font-size: .78rem; padding: 4px 8px; font-weight: 600; }
  .btn-toggle-all:hover { color: #4a3b8c; }
  .btn-review {
    width: 100%; padding: 13px; color: #fff;
    background: linear-gradient(135deg, #f2994a, #f2c94c);
  }
  .btn-review:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(242,153,74,.4); }
  .review-hint { font-size: .78rem; color: #b08968; margin-top: 8px; text-align: center; }
  .lesson-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .lesson-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .lesson-item.disabled { cursor: default; opacity: .6; }
  .lesson-item.disabled:hover { border-color: #e5e0f5; background: #fff; }
  .lesson-item input { width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; flex-shrink: 0; }
  .lesson-item .name { font-weight: 700; color: #333; display: flex; flex-direction: column; gap: 2px; }
  .lesson-item .name small { font-weight: 400; color: #999; font-size: .78rem; }
  .lesson-item .count { margin-left: auto; color: #999; font-size: .8rem; white-space: nowrap; text-align: right; line-height: 1.5; }
  .lesson-item .count b { color: #667eea; }
  .mode-list { display: flex; gap: 10px; margin-bottom: 16px; }
  .mode-item {
    flex: 1; display: flex; flex-direction: column; gap: 4px;
    padding: 12px 14px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none; text-align: center;
  }
  .mode-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .mode-item.selected { border-color: #667eea; background: #f3f0ff; }
  .mode-item input { display: none; }
  .mode-item .mode-name { font-weight: 700; color: #4a3b8c; }
  .mode-item .mode-desc { font-size: .78rem; color: #999; }
  .section-label { font-size: .85rem; font-weight: 700; color: #777; margin-bottom: 8px; }
  .count-list { display: flex; gap: 8px; margin-bottom: 14px; }
  .count-item {
    flex: 1; padding: 10px 6px; border: 2px solid #e5e0f5; border-radius: 12px;
    cursor: pointer; transition: all .15s; user-select: none; text-align: center;
  }
  .count-item:hover { border-color: #b3a5e8; background: #f8f6ff; }
  .count-item.selected { border-color: #667eea; background: #f3f0ff; }
  .count-item.wide { flex: 1.6; }
  .count-item input { position: absolute; opacity: 0; pointer-events: none; }
  .count-item:has(input:focus-visible) { outline: 3px solid #a78bfa; outline-offset: 2px; }
  .count-name { font-weight: 700; color: #4a3b8c; font-size: .93rem; }
  .count-hint { font-size: .78rem; color: #8b7cc8; min-height: 18px; margin: -6px 0 10px; text-align: center; line-height: 1.5; }
  .seen-line { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: .78rem; color: #999; margin-top: 8px; flex-wrap: wrap; }

  /* 실시간 점수 */
  .score-line { display: flex; gap: 16px; justify-content: center; margin-bottom: 14px; font-weight: 700; font-size: .95rem; }
  .score-line .sc-ok { color: #27ae60; }
  .score-line .sc-no { color: #e74c3c; }

  /* 해설 · 서술형 */
  .answer-reveal { margin-top: 18px; background: #f7f5ff; border-radius: 14px; padding: 18px 20px; }
  .answer-label { font-size: .8rem; color: #8b7cc8; font-weight: 700; margin-bottom: 6px; }
  .explain-text { font-size: .93rem; color: #444; line-height: 1.7; }
  .model { background: #fff; border: 2px solid #27ae60; border-radius: 10px; padding: 10px 14px; line-height: 1.75; color: #1d4d33; margin-bottom: 14px; }
  .mine { background: #fff; border: 1.5px dashed #b3a5e8; border-radius: 10px; padding: 8px 14px; white-space: pre-wrap; color: #555; margin-bottom: 14px; line-height: 1.6; }
  .write-input {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit; line-height: 1.6;
    border: 2px solid #b3a5e8; border-radius: 12px; color: #2d2456; outline: none; resize: vertical;
  }
  .write-input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
  .write-input:disabled { background: #f5f5f5; color: #999; }
  .write-hint { font-size: .75rem; color: #aaa; text-align: center; margin-top: 6px; }
  .self-check-q { font-size: .92rem; color: #666; margin: 14px 0 10px; text-align: center; }
  .self-check { display: flex; gap: 10px; }
  .btn-self { flex: 1; padding: 14px; font-size: 1rem; }
  .btn-self.ok { background: #eafaf1; color: #1e8449; border: 2px solid #27ae60; }
  .btn-self.ok:hover { background: #d4f5e3; }
  .btn-self.no { background: #fdedec; color: #c0392b; border: 2px solid #e74c3c; }
  .btn-self.no:hover { background: #fadbd8; }

  /* 시험 기록 */
  .history-section { margin-top: 24px; }
  .history-title { font-size: .9rem; font-weight: 700; color: #666; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .btn-clear-history { background: none; color: #bbb; font-size: .75rem; padding: 4px 8px; }
  .btn-clear-history:hover, .btn-clear-history.armed { color: #e74c3c; }
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
  .history-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #f7f5ff; border-radius: 10px; font-size: .82rem; flex-wrap: wrap; }
  .history-item .h-mode { font-weight: 700; color: #4a3b8c; white-space: nowrap; }
  .history-item .h-score { font-weight: 700; color: #333; white-space: nowrap; }
  .history-item .h-range { color: #999; }
  .history-item .h-date { color: #bbb; margin-left: auto; white-space: nowrap; }
  .history-empty { text-align: center; color: #bbb; font-size: .85rem; padding: 12px; }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 600; transition: all .15s;
  }
  button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 2px; }
  .btn-primary {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,.4); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* 퀴즈 화면 */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .round-badge {
    background: #eef; color: #556; font-size: .8rem; font-weight: 700;
    padding: 4px 12px; border-radius: 999px;
  }
  .round-badge.retry { background: #fde8e8; color: #c0392b; }
  .btn-restart { background: #f0f0f0; color: #666; padding: 6px 14px; font-size: .82rem; }
  .btn-restart:hover { background: #e0e0e0; }
  .btn-restart.armed { background: #fde8e8; color: #c0392b; }
  .progress-track { background: #eee; border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, #667eea, #a78bfa); transition: width .3s;
  }
  .progress-text { font-size: .8rem; color: #999; text-align: right; margin-bottom: 18px; }

  .q-box { margin-bottom: 20px; }
  .q-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: .82rem; font-weight: 700; color: #8b7cc8; margin-bottom: 10px; }
  .subj-chip { color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .78rem; }
  .type-chip { padding: 1px 8px; border-radius: 999px; font-size: .74rem; border: 1.5px solid currentColor; }
  .type-chip.essay { color: #d35400; }
  .new-chip { padding: 1px 8px; border-radius: 999px; font-size: .74rem; background: #fff4d6; color: #b7791f; }
  .q-topic { color: #aaa; font-weight: 600; }
  .q-group { font-size: .9rem; font-weight: 700; color: #444; margin-bottom: 8px; }
  .question { font-size: 1.08rem; font-weight: 700; color: #2d2456; line-height: 1.6; margin-top: 4px; }
  .question .qno { color: #4a3b8c; margin-right: 4px; }
  .question .pts { font-weight: 600; color: #999; font-size: .85rem; white-space: nowrap; margin-left: 4px; }
  .word-hint { font-size: .85rem; color: #aaa; margin-top: 8px; }

  /* 시험지 스타일 (지문·보기·표·그림) */
  .paper {
    background: #fff; border: 1px solid #ddd6f3; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    font-size: .95rem; line-height: 1.8; color: #222; overflow-x: auto;
  }
  .paper p, .box p, .explain-text p, .model p { margin: 0 0 .55em; }
  .paper p:last-child, .box p:last-child, .explain-text p:last-child, .model p:last-child { margin-bottom: 0; }
  .u { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
  .box {
    border: 1.5px solid #555; border-radius: 4px; padding: 12px 14px; margin: 10px 0;
    font-size: .93rem; line-height: 1.75; background: #fff; color: #222; overflow-x: auto;
  }
  .box-t { text-align: center; font-weight: 700; margin-bottom: 6px; letter-spacing: .25em; }
  .box-t::before { content: '<'; letter-spacing: .4em; }
  .box-t::after { content: '>'; }
  table.t { border-collapse: collapse; margin: 8px auto; font-size: .9rem; }
  table.t th, table.t td { border: 1px solid #666; padding: 5px 10px; text-align: center; vertical-align: middle; }
  table.t th { background: #f3f1f9; font-weight: 700; }
  .dlg p { padding-left: 2.2em; text-indent: -2.2em; margin: 0 0 .35em; }
  .fig { text-align: center; margin: 10px 0; }
  .fig svg, .figs svg, .choice svg, .box svg, .model svg, .explain-text svg { max-width: 100%; height: auto; }
  .figs { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 10px 0; }
  .figs figure { margin: 0; text-align: center; }
  figcaption { font-size: .85rem; color: #555; margin-top: 4px; }
  .src { text-align: right; font-size: .8rem; color: #777; margin-top: 4px; }
  .ttl { text-align: center; font-weight: 800; margin-bottom: 8px; }
  .blank { display: inline-block; min-width: 4em; border-bottom: 1.5px solid #333; }
  .ans-line { margin-top: 8px; color: #555; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    padding: 12px 16px; border: 2px solid #e5e0f5; border-radius: 12px;
    background: #fff; font-size: 1rem; text-align: left; color: #333; font-weight: 500;
    display: flex; align-items: flex-start; gap: 12px; line-height: 1.55;
  }
  .choice .num {
    background: #f0edfb; color: #7c6bd0; font-size: .95rem; font-weight: 700;
    width: 26px; height: 26px; border-radius: 6px; margin-top: -1px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .choice:hover:not(:disabled) { border-color: #a78bfa; background: #faf8ff; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: #27ae60; background: #eafaf1; color: #1e8449; font-weight: 700; }
  .choice.correct .num { background: #27ae60; color: #fff; }
  .choice.wrong { border-color: #e74c3c; background: #fdedec; color: #c0392b; }
  .choice.wrong .num { background: #e74c3c; color: #fff; }
  .choice.dim { opacity: .45; }

  .feedback { text-align: center; margin-top: 18px; min-height: 30px; font-weight: 700; font-size: 1.05rem; }
  .feedback.ok { color: #27ae60; }
  .feedback.no { color: #e74c3c; }

  .btn-next { width: 100%; padding: 14px; margin-top: 14px; background: #4a3b8c; color: #fff; }
  .btn-next:hover { background: #5c4bad; }

  /* 결과 화면 */
  .result-emoji { font-size: 4rem; text-align: center; margin-bottom: 12px; }
  .result-title { text-align: center; font-size: 1.4rem; font-weight: 800; color: #2d2456; margin-bottom: 20px; }
  .stats { display: flex; gap: 10px; margin-bottom: 8px; }
  .stat { flex: 1; background: #f7f5ff; border-radius: 14px; padding: 16px 8px; text-align: center; }
  .stat .val { font-size: 1.6rem; font-weight: 800; color: #4a3b8c; }
  .stat .label { font-size: .78rem; color: #999; margin-top: 4px; }
  .stats-note { font-size: .75rem; color: #aaa; text-align: center; margin-bottom: 22px; }
  .wrong-list-title { font-size: .9rem; font-weight: 700; color: #666; margin-bottom: 10px; }
  .wrong-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; max-height: 260px; overflow-y: auto; }
  .wrong-item { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; background: #fdf5f5; border-radius: 10px; font-size: .92rem; }
  .wrong-item .top { display: flex; justify-content: space-between; gap: 8px; }
  .wrong-item .en { font-weight: 700; color: #b03a2e; }
  .wrong-item .ko { color: #666; font-size: .85rem; }
  .wrong-item .cnt { color: #d98880; font-size: .8rem; white-space: nowrap; }
  .perfect-msg { text-align: center; color: #27ae60; font-weight: 600; margin-bottom: 22px; }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 22px 16px; }
    .paper { padding: 14px 12px; }
    .stats { flex-wrap: wrap; }
    .stat { flex: 1 1 40%; }
    .count-list { flex-wrap: wrap; }
    .count-item { flex: 1 1 40%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>
// ===== 문제 은행 (기출 형식 모의고사 회차들) =====
const EXAM_SETS = [];
EXAM_SETS.push({
 "id": "kor-1",
 "subject": "국어",
 "name": "국어 실전 1회",
 "desc": "1-(1)단원 · 2단원 · 기출 형식",
 "questions": [
  {
   "no": "1",
   "type": "선택형",
   "points": 2,
   "topic": "요약하며 읽기",
   "group": "※[객1∼2, 서1] 다음 글을 읽고 물음에 답하시오.",
   "passage": "<p><b>(가)</b> 밤하늘에 초록빛 커튼이 일렁이는 사진이나 영상을 본 적이 있는가? 북극 가까운 지역의 밤하늘을 신비롭게 물들이는 이 빛을 오로라라고 한다. 오로라를 직접 본 사람들은 평생 잊지 못할 장면이라고 말하고, 오로라를 보기 위해 먼 나라까지 여행을 떠나는 사람도 많다. 그렇다면 오로라는 도대체 어떻게 생기는 것일까? 지금부터 '밤하늘의 춤'이라고도 불리는 오로라에 대해 알아보자.</p>\n<p><b>(나)</b> 오로라를 처음 본 사람 중에는 구름이 달빛을 반사하여 생긴 빛이라고 생각하는 사람도 있다. 하지만 오로라의 정체는 태양에서 날아온 입자와 지구의 공기가 만나 생기는 빛이다. 태양은 전기를 띤 아주 작은 입자들을 우주 공간으로 끊임없이 내뿜는데, 이 입자의 흐름을 태양풍이라고 한다. 태양풍이 지구 가까이 오면 대부분은 지구의 자기장에 막혀 비껴가지만, 일부는 자기장을 따라 북극과 남극 쪽으로 끌려 들어온다. 이 입자들이 높은 하늘에 있는 산소나 질소와 부딪치면 그 에너지로 공기가 빛을 내는데, 이것이 바로 오로라이다.</p>\n<p><b>(다)</b> 오로라는 초록색으로 보이는 경우가 가장 많지만 붉은색이나 보라색으로 빛나기도 한다. 오로라의 색깔은 태양풍의 입자가 어떤 기체와 부딪치는지, 그리고 어느 높이에서 부딪치는지에 따라 달라진다. 지상에서 약 100~200킬로미터 높이에서 산소와 부딪치면 초록색 빛이 나고, 그보다 더 높은 곳에서 산소와 부딪치면 붉은색 빛이 난다. 또 비교적 낮은 높이에서 질소와 부딪치면 푸른색이나 보라색 빛이 난다.</p>\n<p><b>(라)</b> 이렇게 아름다운 오로라를 아무 곳에서나 볼 수 있는 것은 아니다. 태양풍의 입자가 자기장을 따라 극지방 쪽으로 모이기 때문에, 오로라는 주로 북극이나 남극에 가까운 지역에서 나타난다. 캐나다 북부, 미국 알래스카, 노르웨이 북부, 아이슬란드 등이 오로라를 보기 좋은 곳으로 알려진 까닭이 여기에 있다. 우리나라처럼 극지방에서 멀리 떨어진 곳에서는 오로라를 거의 볼 수 없다. 또한 오로라는 낮에도 생기지만 밝은 햇빛에 가려 보이지 않으므로 하늘이 충분히 어두운 밤에만 볼 수 있다. 그래서 극지방 가까운 곳이라도 밤이 매우 짧은 여름보다는 밤이 긴 겨울철에 오로라를 보기가 좋다.</p>\n<p><b>(마)</b> 오로라가 무엇인지 몰랐던 옛날 사람들은 하늘에서 일렁이는 빛을 보며 저마다 다른 생각을 했다. 핀란드에서는 오로라를 '여우의 불'이라는 뜻의 말로 부르는데, 신비로운 여우가 눈 덮인 들판을 달리며 꼬리로 눈을 흩날리면 그 불꽃이 하늘로 날아올라 오로라가 된다는 이야기가 전해진다. 반면에 오로라를 두려워한 사람들도 있었다. 중세 유럽에서는 하늘을 붉게 물들인 오로라를 전쟁이나 전염병 같은 재앙이 닥칠 징조로 여기기도 했다. 이처럼 같은 오로라를 보고도 사람들은 서로 다른 의미를 부여했던 것이다.</p>",

   "passage": "<p>옛날 어느 시골 마을에 과거 시험을 보러 한양으로 떠나는 젊은 선비가 있었어. 선비는 활 한 자루를 등에 메고 봇짐을 진 채 험한 산길을 부지런히 걸었지.</p>\n<p>한참 고개를 넘어가는데 어디선가 까치들이 요란하게 우는 소리가 들리는 거야. 소리 나는 쪽을 보니 커다란 나무 위 까치 둥지로 구렁이 한 마리가 스르르 기어 올라가고 있지 뭐야. 둥지 안에서는 아직 날지도 못하는 새끼 까치들이 짹짹거리고, 어미 까치 두 마리는 둥지 둘레를 빙빙 돌며 어쩔 줄을 몰라 했어.</p>\n<p>㉠ <span class=\"u\">\"저런! 저대로 두었다가는 새끼들이 모두 잡아먹히고 말겠구나.\"</span></p>\n<p>선비는 얼른 활에 화살을 걸고 구렁이를 향해 힘껏 쏘았어. 화살은 구렁이 몸에 정확히 꽂혔고, 구렁이는 나무 아래로 툭 떨어져 죽고 말았지. 어미 까치들은 고맙다는 듯이 선비 머리 위를 몇 바퀴 돌고는 둥지로 돌아갔어.</p>\n<p>다시 길을 떠난 선비는 깊은 산속에서 그만 날이 저물고 말았어. 어디 묵을 곳이 없나 두리번거리는데, 저 멀리 불빛 하나가 반짝이는 거야. 찾아가 보니 외딴 기와집이 한 채 있고, 곱게 차려입은 여인이 나와 선비를 반갑게 맞았지.</p>\n<p>\"길을 잃은 나그네이니 하룻밤만 묵어가게 해 주십시오.\"</p>\n<p>여인은 따뜻한 방을 내주고 저녁상까지 차려 주었어. ㉡ <span class=\"u\">선비는 깊은 산속에 이렇게 친절한 사람이 사는 것이 조금 이상하다고 생각했지만, 몸이 너무 고단해서 곧 곯아떨어졌지.</span></p>\n<p>그런데 한밤중에 숨이 턱턱 막혀서 눈을 떠 보니, 커다란 구렁이가 선비의 몸을 칭칭 감고 있는 거야.</p>\n<p>\"네 이놈! 네가 낮에 활로 쏘아 죽인 구렁이가 바로 내 남편이다. ㉢ <span class=\"u\">나는 남편의 원수를 갚으려고 사람으로 변해 너를 기다리고 있었다.</span>\"</p>\n<p>선비는 목숨만 살려 달라고 싹싹 빌었어. 그러자 구렁이가 말했지.</p>\n<p>\"좋다. 이 산꼭대기에 있는 낡은 절에 종이 하나 걸려 있다. ㉣ <span class=\"u\">날이 밝기 전에 그 종이 세 번 울리면 너를 살려 주마.</span> 하지만 종이 울리지 않으면 너를 잡아먹겠다.\"</p>\n<p>선비는 눈앞이 캄캄했어. 아무도 살지 않는 산꼭대기 빈 절에서 누가 종을 쳐 준단 말이야. 선비는 꼼짝없이 죽게 되었다고 생각하며 눈을 질끈 감았지.</p>\n<p>그렇게 얼마나 지났을까? 새벽이 가까워 올 무렵, 산꼭대기에서 \"데엥\" 하고 종소리가 울려 퍼졌어. 이어서 \"데엥\" 하고 두 번째 종소리가, 조금 뒤에 \"데엥\" 하고 세 번째 종소리가 들렸지. ㉤ <span class=\"u\">종소리를 들은 구렁이는 선비를 풀어 주고는 어둠 속으로 사라져 버렸어.</span></p>\n<p><b>[뒷부분의 줄거리]</b><br>날이 밝자 선비는 종소리의 정체가 궁금해 산꼭대기의 절로 올라간다. 종 아래에는 머리가 깨지고 온몸이 피투성이가 된 까치 두 마리가 죽어 있었다. 선비가 구해 준 새끼들의 어미 까치가 몸으로 종을 들이받아 은혜를 갚은 것이다. 선비는 까치들을 정성껏 묻어 준 뒤 한양으로 가서 과거에 급제한다.</p>",
   "q": "다음은 하준이가 윗글을 요약하며 읽은 후 느낀 점이다. 이를 통해 알 수 있는 요약하며 읽기의 효과를 <b><span class=\"u\">두 가지</span></b> 서술하시오. [각 3점]\n<div class=\"box\">하준: 이야기를 요약하면서 읽었더니, 긴 이야기 속에서 꼭 필요한 중요한 내용이 무엇인지 잘 드러났어. 그래서 이 이야기를 모르는 동생에게도 짧고 알기 쉽게 이야기를 전해 줄 수 있었어.</div>\n<div class=\"ans-line\">첫 번째, ______________________</div><div class=\"ans-line\">두 번째, ______________________</div>",

   "passage": "<p><b>(가)</b> 에너지 자원은 사람이 생활하거나 산업 활동을 하는 데 필요한 에너지를 얻을 수 있는 자원을 말한다. 우리는 에너지 자원으로 전기를 만들고, 자동차를 움직이고, 추운 겨울에 집을 따뜻하게 한다. 에너지 자원의 종류는 여러 가지이지만, 크게 쓰면 쓸수록 줄어드는 화석 에너지와 자연에서 끊임없이 얻을 수 있는 재생 에너지로 나눌 수 있다.</p>\n<p><b>(나)</b> 석탄은 아주 먼 옛날 땅속에 묻힌 식물이 오랜 시간 동안 높은 열과 압력을 받아 만들어진 화석 에너지이다. 석탄은 산업 혁명 때 증기 기관을 움직이는 연료로 널리 쓰였고, 오늘날에도 화력 발전소에서 전기를 만들거나 제철소에서 철을 생산하는 데 쓰인다. 하지만 석탄을 태우면 이산화 탄소와 미세 먼지 같은 오염 물질이 많이 나온다는 문제가 있다.</p>\n<p><b>(다)</b> 석유는 먼 옛날 바다에 살던 작은 생물의 몸이 땅속에 쌓여 오랜 시간 열과 압력을 받아 만들어진 화석 에너지이다. 석유에서 뽑아낸 휘발유와 경유는 자동차, 배, 비행기의 연료로 쓰이고, 석유는 플라스틱이나 합성 섬유를 만드는 원료로도 쓰인다. 석유는 서아시아 등 일부 지역에 많이 묻혀 있고 매장량도 한정되어 있어, 생산 지역의 사정에 따라 가격이 크게 오르내리기도 한다.</p>\n<p><b>(라)</b> 태양 에너지와 풍력 에너지는 대표적인 재생 에너지이다. 태양광 발전은 태양 전지를 이용해 햇빛을 전기로 바꾸고, 풍력 발전은 바람의 힘으로 커다란 날개를 돌려 전기를 만든다. 두 에너지는 발전 과정에서 오염 물질을 거의 내보내지 않고 없어질 걱정도 없다. 다만 날씨나 계절에 따라 만들 수 있는 전기의 양이 달라지고, 발전 시설을 세우는 데 넓은 땅이 필요하다는 단점이 있다.</p>\n<p><b>(마)</b> 수력 에너지는 높은 곳에서 낮은 곳으로 흐르는 물의 힘을 이용하는 재생 에너지이다. 강에 댐을 쌓아 물을 가두었다가 흘려보내면, 떨어지는 물의 힘으로 발전기를 돌려 전기를 만들 수 있다. 수력 발전은 비가 많이 오고 물이 떨어지는 높이 차가 큰 곳에 유리하다. 그러나 댐을 건설하면 주변 생태계가 달라지고 마을이 물에 잠기기도 한다.</p>",

   "q": "다음은 용언의 활용형이 자연스러우면 ○ 표, 어색하면 × 표로 나타낸 자료이다. 이를 통해 알 수 있는 형용사 활용의 특징을 ( ㉮ ) ~ ( ㉰ )에 알맞은 말을 넣어 완성하시오. [각 2점]\n<table class=\"t\"><tr><th colspan=\"2\">뛰다</th><th colspan=\"2\">작다</th></tr>\n<tr><td>아이가 뛴다.</td><td>○</td><td>신발이 작는다.</td><td>×</td></tr>\n<tr><td>뛰는 아이</td><td>○</td><td>작는 신발</td><td>×</td></tr>\n<tr><td>얘들아, 같이 뛰자.</td><td>○</td><td>얘들아, 같이 작자.</td><td>×</td></tr>\n<tr><td>얘들아, 힘껏 뛰어라.</td><td>○</td><td>얘들아, 조금 작아라.</td><td>×</td></tr></table>\n<div class=\"box\">동사와 달리 형용사에는 '-는다/-ㄴ다'와 같은 현재형 어미, '( ㉮ )'과 같은 현재 관형사형 어미, '-자'와 같은 ( ㉯ )형 어미, '-아라/-어라'와 같은 ( ㉰ )형 어미를 붙여 쓸 수 없다.</div>",
   "answer": "㉮ -는<br>㉯ 청유<br>㉰ 명령",

   "q": "다음은 국어사전 내용의 일부로, 제시어 '같이'는 문장 안에서 어떤 품사로 쓰이느냐에 따라 그 기능과 의미가 달라진다. '같이'를 주어진 품사에 맞게 활용하여 국어사전에 들어갈 또 다른 예문을 각각 완성하시오. [각 2점]\n<div class=\"box\"><div class=\"box-t\">조 건</div>주어진 &lt;예문&gt;을 참고하되, '같이'와 조사를 제외하고 &lt;예문&gt;에서 이미 사용된 단어는 사용하지 말 것. 띄어쓰기를 정확히 할 것.</div>\n<table class=\"t\"><tr><th colspan=\"2\">제시어: 같이</th></tr>\n<tr><td>[부사]<br>둘 이상의 사람이나 사물이 함께.</td><td>[조사]<br>앞말이 보이는 전형적인 어떤 특징처럼.</td></tr>\n<tr><td>&lt;예문&gt; 친구와 도서관에 같이 갔다.</td><td>&lt;예문&gt; 얼음장같이 차가운 손을 녹였다.</td></tr>\n<tr><td>&lt;예문&gt;</td><td>&lt;예문&gt;</td></tr></table>",

   "passage": "<p><b>(가)</b> 달콤한 꿀을 만드는 꿀벌은 우리에게 무척 친숙한 곤충이다. 하지만 꿀벌이 무리 속에서 어떻게 살아가는지, 꿀벌이 사라지면 어떤 일이 벌어지는지 아는 사람은 많지 않다. 작은 몸으로 부지런히 꽃 사이를 날아다니는 꿀벌은 과연 어떤 곤충일까? 지금부터 꿀벌의 생활과 꿀벌이 우리에게 주는 도움에 대해 알아보자.</p>\n<p><b>(나)</b> 꿀벌은 한 벌집에 수만 마리가 모여 사는 사회성 곤충이다. 한 무리에는 여왕벌, 일벌, 수벌이 있으며 각자 맡은 일이 다르다. 여왕벌은 보통 한 무리에 한 마리뿐이며 알을 낳는 일을 한다. 무리의 대부분을 차지하는 일벌은 모두 암컷으로, 꿀과 꽃가루를 모으고, 벌집을 짓고, 애벌레를 돌보는 등 거의 모든 일을 도맡는다. 수컷인 수벌은 여왕벌과 짝짓기를 하는 역할을 한다.</p>\n<p><b>(다)</b> 꿀벌은 먹이가 있는 곳을 동료에게 알릴 때 말 대신 춤을 춘다. 먹이를 찾아낸 일벌은 벌집으로 돌아와, 먹이가 가까운 곳에 있으면 원을 그리며 빙글빙글 도는 원형 춤을 춘다. 반대로 먹이가 먼 곳에 있으면 숫자 8 모양을 그리며 도는 8자 춤을 춘다. 8자 춤을 출 때에는 가운데 부분에서 몸을 흔들며 나아가는 방향으로 태양의 위치를 기준으로 한 먹이의 방향을 알려 주고, 몸을 흔드는 시간으로 먹이까지의 거리를 알려 준다. 먹이가 멀리 있을수록 몸을 흔드는 시간이 길어진다. 꿀벌의 이러한 춤 언어는 오스트리아의 과학자 카를 폰 프리슈가 오랜 관찰 끝에 밝혀낸 것이다.</p>\n<p><b>(라)</b> 꿀벌은 꿀을 만드는 것 말고도 사람에게 큰 도움을 준다. 꿀벌이 꿀과 꽃가루를 모으려고 이 꽃 저 꽃을 옮겨 다니면, 몸에 묻은 꽃가루가 다른 꽃의 암술에 옮겨 붙는다. 이렇게 꽃가루받이가 이루어져야 식물은 열매와 씨앗을 맺을 수 있다. 사과, 딸기, 호박처럼 우리가 즐겨 먹는 많은 농작물이 꿀벌 같은 곤충의 도움을 받아 열매를 맺는다. 국제 연합(UN)의 한 보고서에 따르면, 세계 식량의 약 90%를 차지하는 100가지 주요 농작물 가운데 71가지가 꿀벌의 꽃가루받이에 기대고 있다고 한다.</p>\n<p><b>(마)</b> 그런데 최근 세계 곳곳에서 꿀벌의 수가 크게 줄어들고 있다. 우리나라에서도 겨울을 지나며 벌통 속 꿀벌이 한꺼번에 사라지는 일이 잇따라 양봉 농가가 큰 피해를 입었다. 과학자들은 기후 변화로 꽃이 피는 시기가 달라진 것, 지나친 농약 사용, 꿀벌에 붙어사는 해충인 응애의 확산 등을 주요 원인으로 꼽는다. 꿀벌이 사라지면 꽃가루받이가 제대로 이루어지지 않아 농작물 생산이 줄고, 결국 우리의 식탁도 위협받게 된다. 그래서 여러 나라에서는 꿀벌에게 해로운 농약 사용을 줄이고, 꿀벌이 먹이를 구할 수 있는 꽃과 나무를 심는 등 꿀벌을 지키기 위해 노력하고 있다.</p>",

   "passage": "<p>옛날 어느 산골 마을에 가진 것이라고는 좁쌀 한 톨밖에 없는 가난한 총각이 살았어. 하루는 총각이 그 좁쌀 한 톨을 손바닥에 올려놓고 한참을 들여다보더니 큰 소리로 말했지.</p>\n<p>㉠ <span class=\"u\">\"나는 이 좁쌀 한 톨로 한양에 가서 장가를 들고 오겠소!\"</span></p>\n<p>마을 사람들은 모두 배를 잡고 웃었어. 그래도 총각은 좁쌀 한 톨을 소중하게 주머니에 넣고 씩씩하게 길을 떠났지.</p>\n<p>한참을 걸어 날이 저물자 총각은 한 주막에 들어갔어.</p>\n<p>\"주인장, 이건 아주 귀한 좁쌀이니 하룻밤만 잘 맡아 주시오.\"</p>\n<p>주인은 별 싱거운 사람 다 보겠다며 좁쌀을 받아 선반 위에 올려 두었지. 그런데 밤사이 쥐가 나와서 그 좁쌀을 냉큼 먹어 버린 거야. 아침이 되자 총각이 좁쌀을 찾았어.</p>\n<p>\"아이고, 쥐가 먹어 버렸으니 어쩐다?\"</p>\n<p>㉡ <span class=\"u\">\"그럼 좁쌀을 먹은 쥐라도 내놓으시오. 귀한 좁쌀을 잃었으니 쥐라도 받아 가야겠소.\"</span></p>\n<p>주인은 하도 기가 막혀서 쥐를 잡아 총각에게 줘 버렸어.</p>\n<p>총각은 쥐를 들고 다음 주막에 가서 또 맡겼지. 그런데 이번에는 밤사이 주막집 고양이가 쥐를 잡아먹었어. 총각은 쥐를 먹은 고양이를 받아 냈지. 다음 날 밤에는 주막집 개가 고양이를 물어 죽이는 바람에 개를 받았고, 그다음 날 밤에는 말이 개를 걷어차는 바람에 말을 받았어. 또 그다음 날에는 소가 뿔로 말을 들이받는 바람에 소를 받게 되었지. ㉢ <span class=\"u\">좁쌀 한 톨이 어느새 커다란 황소 한 마리가 된 거야.</span></p>\n<p>총각은 황소를 끌고 한양에 도착해 어느 정승 댁에 하룻밤 묵기를 청했어.</p>\n<p>\"이 황소는 아주 귀한 소이니 잘 좀 맡아 주십시오.\"</p>\n<p>그런데 그날 밤, 정승 댁 아들이 몰래 황소를 끌고 나가 동무들과 잡아먹어 버렸어. 아침이 되자 총각이 소를 내놓으라고 했지. 정승은 사정을 듣고는 소값을 넉넉히 쳐서 돈으로 주겠다고 했어.</p>\n<p>㉣ <span class=\"u\">\"아닙니다. 소를 먹은 사람을 주시든지, 아니면 그만한 사람을 주십시오. 저는 돈은 필요 없습니다.\"</span></p>\n<p>정승은 난처했어. 귀한 아들을 내줄 수도 없고 말이야. 그때 문밖에서 이야기를 듣던 정승의 딸이 나섰어.</p>\n<p>\"아버지, 좁쌀 한 톨로 황소를 얻을 만큼 꾀와 배짱이 있는 사람이라면 믿고 따를 만합니다. 제가 저 총각을 따라가겠어요.\"</p>\n<p>㉤ <span class=\"u\">정승은 딸의 말을 듣고 한참을 생각하더니 무릎을 탁 쳤어.</span></p>\n<p><b>[뒷부분의 줄거리]</b><br>정승은 총각의 지혜와 배짱을 알아보고 딸과 혼인하게 해 준다. 총각은 처음에 말한 대로 좁쌀 한 톨로 장가를 들어 아내와 함께 고향으로 돌아가고, 마을 사람들은 모두 깜짝 놀란다.</p>",

   "passage": "<p><b>(가)</b> 겨울이 되면 기온이 크게 떨어지고 먹이도 부족해진다. 그래서 생물들은 저마다의 방법으로 추운 겨울을 견뎌 낸다. 생물이 겨울을 나는 방법은 매우 다양하지만, 크게 동물의 겨울나기와 식물의 겨울나기로 나누어 살펴볼 수 있다.</p>\n<p><b>(나)</b> 개구리, 뱀, 박쥐 같은 동물은 겨울잠을 자며 겨울을 난다. 개구리나 뱀은 주변 온도에 따라 체온이 달라지는 동물이어서 날씨가 추워지면 몸을 제대로 움직이기 어렵다. 그래서 땅속이나 바위틈처럼 추위를 피할 수 있는 곳에 들어가 거의 움직이지 않은 채 겨울을 보낸다. 겨울잠을 자는 동안에는 숨 쉬는 횟수와 심장이 뛰는 횟수가 크게 줄어들어 에너지를 아낄 수 있다.</p>\n<p><b>(다)</b> 먹이를 찾아 따뜻한 곳으로 이동하는 동물도 있다. 두루미, 기러기, 청둥오리 같은 겨울 철새는 우리나라보다 북쪽에 있는 지역에서 여름을 보내고, 가을이 되면 그곳보다 따뜻한 우리나라로 날아와 겨울을 난다. 이들은 강이나 호수, 논 같은 곳에서 먹이를 구하며 지내다가 봄이 오면 다시 북쪽으로 돌아간다.</p>\n<p><b>(라)</b> 나무는 겨울에 뿌리에서 물을 빨아올리기 어려운데, 잎이 달려 있으면 잎을 통해 물이 계속 빠져나간다. 그래서 단풍나무나 은행나무 같은 나무는 가을이 되면 잎을 떨어뜨려 몸속의 물이 빠져나가는 것을 줄인다. 또 나뭇가지에는 봄에 새잎이나 꽃이 될 겨울눈을 만들어 두는데, 겨울눈은 단단한 비늘 조각이나 털로 싸여 있어 추위를 견딜 수 있다.</p>\n<p><b>(마)</b> 씨앗으로 겨울을 나는 식물도 있다. 봉선화나 나팔꽃 같은 한해살이풀은 봄에 싹을 틔워 자라고 꽃을 피운 뒤, 가을에 씨앗을 남기고 죽는다. 단단한 껍질에 싸인 씨앗은 추운 겨울을 땅속에서 견디다가 이듬해 봄에 다시 싹을 틔운다.</p>",

   "passage": "<p><b>(가)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 오늘은 미디어 교육 연구소의 박○○ 연구원님과 함께 우리 생활 속 매체에 대해 이야기 나눠 보겠습니다. 안녕하세요?</p>\n<p><b>전문가:</b> 네, 안녕하세요? 반갑습니다.</p>\n<p><b>진행자:</b> 요즘 '대중 매체'라는 말을 자주 듣는데요, 대중 매체란 무엇인가요?</p>\n<p><b>전문가:</b> 매체는 정보를 전달하는 수단을 말합니다. 그중 대중 매체는 불특정 다수의 사람에게 많은 양의 정보를 한꺼번에 전달하는 매체를 가리킵니다.</p>\n<p><b>진행자:</b> 대중 매체에는 어떤 것들이 있나요?</p>\n<p><b>전문가:</b> 잡지나 책처럼 글과 사진으로 정보를 전하는 (    ㉠    ), 텔레비전이나 영화처럼 소리와 움직이는 화면으로 전하는 (    ㉡    ), 라디오처럼 소리로만 전하는 (    ㉢    )로 나눌 수 있습니다.</p>\n<p><b>진행자:</b> 그렇다면 대중 매체에는 어떤 특징이 있나요?</p>\n<p><b>전문가:</b> (                    ㉣                    )</p>\n<p><b>진행자:</b> 요즘은 개인이 직접 만드는 인터넷 방송도 많지요?</p>\n<p><b>전문가:</b> 네, 누구나 스마트폰 하나로 방송을 만들어 올릴 수 있게 되면서 인터넷 개인 방송이 크게 늘었습니다.</p>\n</div>\n<p><b>(나)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 생활 속에서 매체를 이용하는 모습을 그림으로 살펴볼까요?</p>\n<p><b>전문가:</b> 네, 그림 A~D를 함께 보시죠.</p>\n</div><div class=\"figs\"><figure><svg viewBox=\"0 0 260 190\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"258\" height=\"188\" rx=\"6\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"12\" y=\"12\" width=\"110\" height=\"80\" rx=\"4\" fill=\"#333\"/><rect x=\"18\" y=\"18\" width=\"98\" height=\"68\" fill=\"#eef3fb\"/><circle cx=\"67\" cy=\"38\" r=\"9\" fill=\"#fdf1e4\" stroke=\"#333\"/><path d=\"M53 86 Q53 49 67 49 Q81 49 81 86 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><rect x=\"57\" y=\"92\" width=\"20\" height=\"6\" fill=\"#999\"/><rect x=\"130\" y=\"12\" width=\"124\" height=\"40\" rx=\"9\" fill=\"#fff\" stroke=\"#333\"/><polygon points=\"130,34 130,46 116,40\" fill=\"#fff\" stroke=\"#333\"/><line x1=\"130\" y1=\"35\" x2=\"130\" y2=\"45\" stroke=\"#fff\" stroke-width=\"2.5\"/><text x=\"138\" y=\"29\" font-size=\"11\" fill=\"#333\">오늘 오후 서울에</text><text x=\"138\" y=\"44\" font-size=\"11\" fill=\"#333\">첫눈이 내렸습니다.</text><path d=\"M151.8 186.6 Q151.8 147.6 170 147.6 Q188.2 147.6 188.2 186.6 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><circle cx=\"170\" cy=\"132\" r=\"13\" fill=\"#f    "passage": "<p><b>(가)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 오늘은 미디어 교육 연구소의 박○○ 연구원님과 함께 우리 생활 속 매체에 대해 이야기 나눠 보겠습니다. 안녕하세요?</p>\n<p><b>전문가:</b> 네, 안녕하세요? 반갑습니다.</p>\n<p><b>진행자:</b> 요즘 '대중 매체'라는 말을 자주 듣는데요, 대중 매체란 무엇인가요?</p>\n<p><b>전문가:</b> 매체는 정보를 전달하는 수단을 말합니다. 그중 대중 매체는 불특정 다수의 사람에게 많은 양의 정보를 한꺼번에 전달하는 매체를 가리킵니다.</p>\n<p><b>진행자:</b> 대중 매체에는 어떤 것들이 있나요?</p>\n<p><b>전문가:</b> 잡지나 책처럼 글과 사진으로 정보를 전하는 (    ㉠    ), 텔레비전이나 영화처럼 소리와 움직이는 화면으로 전하는 (    ㉡    ), 라디오처럼 소리로만 전하는 (    ㉢    )로 나눌 수 있습니다.</p>\n<p><b>진행자:</b> 그렇다면 대중 매체에는 어떤 특징이 있나요?</p>\n<p><b>전문가:</b> (                    ㉣                    )</p>\n<p><b>진행자:</b> 요즘은 개인이 직접 만드는 인터넷 방송도 많지요?</p>\n<p><b>전문가:</b> 네, 누구나 스마트폰 하나로 방송을 만들어 올릴 수 있게 되면서 인터넷 개인 방송이 크게 늘었습니다.</p>\n</div>\n<p><b>(나)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 생활 속에서 매체를 이용하는 모습을 그림으로 살펴볼까요?</p>\n<p><b>전문가:</b> 네, 그림 A~D를 함께 보시죠.</p>\n</div><div class=\"figs\"><figure><svg viewBox=\"0 0 260 190\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"258\" height=\"188\" rx=\"6\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"12\" y=\"12\" width=\"110\" height=\"80\" rx=\"4\" fill=\"#333\"/><rect x=\"18\" y=\"18\" width=\"98\" height=\"68\" fill=\"#eef3fb\"/><circle cx=\"67\" cy=\"38\" r=\"9\" fill=\"#fdf1e4\" stroke=\"#333\"/><path d=\"M53 86 Q53 49 67 49 Q81 49 81 86 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><rect x=\"57\" y=\"92\" width=\"20\" height=\"6\" fill=\"#999\"/><rect x=\"130\" y=\"12\" width=\"124\" height=\"40\" rx=\"9\" fill=\"#fff\" stroke=\"#333\"/><polygon points=\"130,34 130,46 116,40\" fill=\"#fff\" stroke=\"#333\"/><line x1=\"130\" y1=\"35\" x2=\"130\" y2=\"45\" stroke=\"#fff\" stroke-width=\"2.5\"/><text x=\"138\" y=\"29\" font-size=\"11\" fill=\"#333\">오늘 오후 서울에</text><text x=\"138\" y=\"44\" font-size=\"11\" fill=\"#333\">첫눈이 내렸습니다.</text><path d=\"M151.8 186.6 Q151.8 147.6 170 147.6 Q188.2 147.6 188.2 186.6 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><circle cx=\"170\" cy=\"132\" r=\"13\" fill=\"#f    "passage": "<p><b>(가)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 오늘은 미디어 교육 연구소의 박○○ 연구원님과 함께 우리 생활 속 매체에 대해 이야기 나눠 보겠습니다. 안녕하세요?</p>\n<p><b>전문가:</b> 네, 안녕하세요? 반갑습니다.</p>\n<p><b>진행자:</b> 요즘 '대중 매체'라는 말을 자주 듣는데요, 대중 매체란 무엇인가요?</p>\n<p><b>전문가:</b> 매체는 정보를 전달하는 수단을 말합니다. 그중 대중 매체는 불특정 다수의 사람에게 많은 양의 정보를 한꺼번에 전달하는 매체를 가리킵니다.</p>\n<p><b>진행자:</b> 대중 매체에는 어떤 것들이 있나요?</p>\n<p><b>전문가:</b> 잡지나 책처럼 글과 사진으로 정보를 전하는 (    ㉠    ), 텔레비전이나 영화처럼 소리와 움직이는 화면으로 전하는 (    ㉡    ), 라디오처럼 소리로만 전하는 (    ㉢    )로 나눌 수 있습니다.</p>\n<p><b>진행자:</b> 그렇다면 대중 매체에는 어떤 특징이 있나요?</p>\n<p><b>전문가:</b> (                    ㉣                    )</p>\n<p><b>진행자:</b> 요즘은 개인이 직접 만드는 인터넷 방송도 많지요?</p>\n<p><b>전문가:</b> 네, 누구나 스마트폰 하나로 방송을 만들어 올릴 수 있게 되면서 인터넷 개인 방송이 크게 늘었습니다.</p>\n</div>\n<p><b>(나)</b></p><div class=\"dlg\">\n<p><b>진행자:</b> 생활 속에서 매체를 이용하는 모습을 그림으로 살펴볼까요?</p>\n<p><b>전문가:</b> 네, 그림 A~D를 함께 보시죠.</p>\n</div><div class=\"figs\"><figure><svg viewBox=\"0 0 260 190\" width=\"230\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"258\" height=\"188\" rx=\"6\" fill=\"#fff\" stroke=\"#333\"/><rect x=\"12\" y=\"12\" width=\"110\" height=\"80\" rx=\"4\" fill=\"#333\"/><rect x=\"18\" y=\"18\" width=\"98\" height=\"68\" fill=\"#eef3fb\"/><circle cx=\"67\" cy=\"38\" r=\"9\" fill=\"#fdf1e4\" stroke=\"#333\"/><path d=\"M53 86 Q53 49 67 49 Q81 49 81 86 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><rect x=\"57\" y=\"92\" width=\"20\" height=\"6\" fill=\"#999\"/><rect x=\"130\" y=\"12\" width=\"124\" height=\"40\" rx=\"9\" fill=\"#fff\" stroke=\"#333\"/><polygon points=\"130,34 130,46 116,40\" fill=\"#fff\" stroke=\"#333\"/><line x1=\"130\" y1=\"35\" x2=\"130\" y2=\"45\" stroke=\"#fff\" stroke-width=\"2.5\"/><text x=\"138\" y=\"29\" font-size=\"11\" fill=\"#333\">오늘 오후 서울에</text><text x=\"138\" y=\"44\" font-size=\"11\" fill=\"#333\">첫눈이 내렸습니다.</text><path d=\"M151.8 186.6 Q151.8 147.6 170 147.6 Q188.2 147.6 188.2 186.6 Z\" fill=\"#3a7bd5\" stroke=\"#333\"/><circle cx=\"170\" cy=\"132\" r=\"13\" fill=\"#f function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function plainText(html, n) {
  const d = document.createElement("div");
  d.innerHTML = html;
  d.querySelectorAll("svg").forEach(s => s.remove());
  const t = d.textContent.replace(/\s+/g, " ").trim();
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function storeGet(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || fallback); }
  catch (e) { return JSON.parse(fallback); }
}
function storeSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function storeRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

function armButton(btn, armedText, action) {
  btn.addEventListener("click", () => {
    if (btn.classList.contains("armed")) { action(); return; }
    const original = btn.textContent;
    btn.classList.add("armed");

// ===== 푼 문제 기록 (새 문제 우선 출제용) =====
const SEEN_KEY = "eunyul-exam-seen";
function loadSeen() { return storeGet(SEEN_KEY, "{}"); }
function markSeen(id) {
  const seen = loadSeen();
  seen[id] = (seen[id] || 0) + 1;
  storeSet(SEEN_KEY, seen);
}
const seenCount = (qs, seen) => qs.reduce((s, q) => s + (seen[q.id] || 0), 0);

// 가장 적게 푼 후보 중 무작위 하나
function pickLeastSeen(candidates, seen) {
  const scores = candidates.map(c => seenCount(c, seen));
  const min = Math.min(...scores);
  const best = candidates.filter((c, i) => scores[i] === min);
  return best[Math.floor(Math.random() * best.length)];
}

// 한 회차를 "묶음" 단위로 나눔: 같은 안내문·지문을 공유하는 연속 문항은 한 묶음
function blocksOf(setId) {
  const blocks = [];
  ALL_Q.filter(q => q.setId === setId).forEach(q => {
    const last = blocks[blocks.length - 1];
    if (last && q.group && last[0].group === q.group && last[0].passage === q.passage) last.push(q);
    else blocks.push([q]);
  });
  return blocks;
}
const blockSig = b => b.map(q => `${q.type}:${q.no}`).join("|");

// 과목 시험지 1회분 만들기: 뼈대 회차의 번호 구조 그대로, 번호(묶음)마다 덜 푼 회차의 문제로 채움
function assembleExam(subject) {
  const seen = loadSeen();
  const setBlocks = SETS.filter(s => s.subject === subject).map(s => blocksOf(s.id));
  if (!setBlocks.length) return [];
  const skeleton = pickLeastSeen(setBlocks.map(bs => bs.flat()), seen);
  const skeletonBlocks = setBlocks.find(bs => bs[0][0].id === skeleton[0].id);
  const pool = setBlocks.flat();
  return skeletonBlocks.flatMap(b => {
    const sig = blockSig(b);
    return pickLeastSeen(pool.filter(x => blockSig(x) === sig), seen);
  });
}

// 무작위 N문제: 덜 푼 문제부터
function pickQuestions(pool, n) {
  const seen = loadSeen();
  return shuffle(pool).sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0)).slice(0, n);
}

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function historyHTML() {
  const h = loadHistory();
  return `
    <div class="history-section">
      <div class="history-title">
        <span>📜 시험 기록</span>
        ${h.length ? `<button class="btn-clear-history" id="btn-clear-history">기록 지우기</button>` : ""}
      </div>
      ${h.length ? `<div class="history-list">
        ${h.map(e => `
          <div class="history-item">
            <span class="h-mode">${MODE_LABELS[e.mode] || e.mode}</span>
            <span class="h-score">${e.score}점 · ⭕${e.correct} ❌${e.attempts - e.correct}</span>
            <span class="h-range">${escapeHtml(e.range)}</span>
            <span class="h-date">${fmtDate(e.date)}</span>
          </div>`).join("")}
      </div>`
      : `<div class="history-empty">아직 시험 기록이 없어요. 첫 시험을 쳐 보세요!</div>`}
    </div>`;
}

// ===== 오답 통계 (누적) =====
const WRONG_STATS_KEY = "eunyul-exam-wrong-stats";
function loadWrongStats() { return storeGet(WRONG_STATS_KEY, "{}"); }
function bumpWrongStat(id, delta) {
  const stats = loadWrongStats();
  const next = (stats[id] || 0) + delta;
  if (next <= 0) delete stats[id];
  else stats[id] = next;
  storeSet(WRONG_STATS_KEY, stats);
}
function reviewQuestions() {
  const stats = loadWrongStats();
  return ALL_Q.filter(q => stats[q.id] > 0).sort((a, b) => stats[b.id] - stats[a.id]).slice(0, 20);
}

function radioGroup(name, items, selected) {
  return `<div class="count-list">
    ${items.map(([value, label, wide]) => `
      <label class="count-item ${wide ? "wide" : ""} ${value === selected ? "selected" : ""}">
        <input type="radio" name="${name}" value="${value}" ${value === selected ? "checked" : ""}>
        <span class="count-name">${label}</span>
      </label>`).join("")}
  </div>`;
}

const typeMatch = (q, type) => type === "all" || (type === "obj" ? q.type === "선택형" : q.type === "서술형");

// ===== 시작 화면 =====
function renderStart() {
  state = {};
  const seen = loadSeen();
  app.innerHTML = `
    <h1>📝 은율이의 중간고사</h1>
    <p class="subtitle">2026학년도 1학년 2학기 · 기출 형식 모의고사 · 칠 때마다 새 문제</p>
    <div class="section-label">시험 모드</div>
    <div class="mode-list">
      <label class="mode-item selected">
        <input type="radio" name="mode" value="study" checked>
        <span class="mode-name">📖 기본</span>
        <span class="mode-desc">풀자마자<br>해설 보기</span>
      </label>
      <label class="mode-item">
        <input type="radio" name="mode" value="real">
        <span class="mode-name">🔥 실전</span>
        <span class="mode-desc">해설 없이<br>정답만 확인</span>
      </label>
    </div>
    <div class="range-head">
      <span class="section-label">시험 과목</span>
      <button class="btn-toggle-all" id="btn-toggle-all">전체 선택/해제</button>
    </div>
    <div class="lesson-list">
      ${SUBJECTS.map(s => {
        const qs = ALL_Q.filter(q => q.subject === s);
        const sets = SETS.filter(x => x.subject === s).length;
        const unseen = qs.filter(q => !seen[q.id]).length;
        return `
        <label class="lesson-item ${qs.length ? "" : "disabled"}">
          <input type="checkbox" value="${s}" ${qs.length ? "" : "disabled"}>
          <span class="name">${s}<small>${SUBJECT_DESC[s]}</small></span>
          <span class="count">${qs.length
            ? `문제 은행 ${qs.length}문제 (${sets}회분)<br>안 푼 문제 <b>${unseen}</b>`
            : "문제 준비 중"}</span>
        </label>`;
      }).join("")}
    </div>
    <div class="section-label">문제 수</div>
    ${radioGroup("count", [["exam", "📄 시험지 1회분", true], ["10", "10문제"], ["20", "20문제"], ["30", "30문제"]], "exam")}
    <div class="section-label">문제 유형</div>
    ${radioGroup("qtype", [["all", "선택+서술"], ["obj", "선택형만"], ["essay", "서술형만"]], "all")}
    <div class="count-hint" id="count-hint"></div>
    <button class="btn-primary" id="btn-start">시험 시작!</button>
    <div class="seen-line">
      <span>안 푼 문제부터 나와요. 다 풀면 적게 푼 문제부터 다시 나와요.</span>
      ${Object.keys(seen).length ? `<button class="btn-clear-history" id="btn-reset-seen">푼 문제 기록 초기화</button>` : ""}
    </div>
    ${(() => {
      const rq = reviewQuestions();
      const stats = loadWrongStats();
      return `
      <div class="range-head" style="margin-top:24px">
        <span class="section-label">복습</span>
        ${rq.length ? `<button class="btn-clear-history" id="btn-clear-stats">오답 통계 지우기</button>` : ""}
      </div>
      ${rq.length
        ? `<button class="btn-review" id="btn-review">🔁 자주 틀리는 문제만 풀기 (${rq.length}문제)</button>
           <div class="review-hint">많이 틀린 문제: ${rq.slice(0, 3).map(q => `${q.subject} ${escapeHtml(q.topic)} ${stats[q.id]}회`).join(" · ")}</div>`
        : `<div class="history-empty">아직 오답 데이터가 없어요. 시험에서 틀린 문제가 여기에 자동으로 모여요.</div>`}`;
    })()}
    ${historyHTML()}
  `;

  const boxes = [...app.querySelectorAll('.lesson-item input:not(:disabled)')];
  if (boxes.length) boxes[0].checked = true;
  const startBtn = document.getElementById("btn-start");
  const radioValue = name => app.querySelector(`input[name="${name}"]:checked`).value;
  const pickedSubjects = () => boxes.filter(b => b.checked).map(b => b.value);

  const update = () => {
    const subjects = pickedSubjects();
    const type = radioValue("qtype");
    const count = radioValue("count");
    const pool = ALL_Q.filter(q => subjects.includes(q.subject) && typeMatch(q, type));
    const hint = document.getElementById("count-hint");
    let n;
    if (count === "exam") {
      const per = subjects.map(s => {
        const sk = SETS.find(x => x.subject === s);
        return [s, sk ? sk.questions.filter(q => typeMatch(q, type)).length : 0];
      });
      n = per.reduce((sum, [, c]) => sum + c, 0);
      hint.textContent = n ? `번호마다 여러 회차 중 새 문제로 시험지를 만들어요 · ${per.map(([s, c]) => `${s} ${c}문제`).join(" + ")}` : "";
    } else {
      n = Math.min(parseInt(count), pool.length);
      hint.textContent = pool.length && parseInt(count) > pool.length ? `고른 범위에 ${pool.length}문제뿐이라 ${pool.length}문제로 풀어요` : "";
    }
    startBtn.disabled = n === 0;
    startBtn.textContent = !subjects.length ? "시험 과목을 골라 주세요" : n ? `시험 시작! (${n}문제)` : "해당하는 문제가 없어요";
  };

  app.querySelectorAll(".count-item input").forEach(r => r.addEventListener("change", () => {
    app.querySelectorAll(`input[name="${r.name}"]`).forEach(x => x.closest(".count-item").classList.toggle("selected", x.checked));
    update();
  }));
  boxes.forEach(b => b.addEventListener("change", update));
  document.getElementById("btn-toggle-all").addEventListener("click", () => {
    const turnOn = boxes.some(b => !b.checked);
    boxes.forEach(b => { b.checked = turnOn; });
    update();
  });
  const modeInputs = [...app.querySelectorAll('.mode-item input')];
  modeInputs.forEach(r => r.addEventListener("change", () => {
    app.querySelectorAll('.mode-item').forEach(el => el.classList.remove("selected"));
    r.closest(".mode-item").classList.add("selected");
  }));
  update();

  startBtn.addEventListener("click", () => {
    const subjects = pickedSubjects();
    const type = radioValue("qtype");
    const count = radioValue("count");
    const mode = modeInputs.find(r => r.checked).value;
    let qs, keepOrder;
    if (count === "exam") {
      qs = subjects.flatMap(s => assembleExam(s)).filter(q => typeMatch(q, type));
      keepOrder = true;
    } else {
      qs = pickQuestions(ALL_Q.filter(q => subjects.includes(q.subject) && typeMatch(q, type)), parseInt(count));
      keepOrder = false;
    }
    const range = `${subjects.join("·")} ${count === "exam" ? "시험지" : `${qs.length}문제`}`;
    startQuiz(qs, mode, range, false, keepOrder);
  });
  const clearBtn = document.getElementById("btn-clear-history");
  if (clearBtn) armButton(clearBtn, "한 번 더 누르면 지워요", () => { storeRemove(HISTORY_KEY); renderStart(); });
  const resetSeenBtn = document.getElementById("btn-reset-seen");
  if (resetSeenBtn) armButton(resetSeenBtn, "한 번 더 누르면 초기화해요", () => { storeRemove(SEEN_KEY); renderStart(); });
  const reviewBtn = document.getElementById("btn-review");
  if (reviewBtn) reviewBtn.addEventListener("click", () => {
    startQuiz(reviewQuestions(), modeInputs.find(r => r.checked).value, "복습", true, false);
  });
  const clearStatsBtn = document.getElementById("btn-clear-stats");
  if (clearStatsBtn) armButton(clearStatsBtn, "한 번 더 누르면 지워요", () => { storeRemove(WRONG_STATS_KEY); renderStart(); });
}

// ===== 퀴즈 시작 =====
// keepOrder: 시험지 1회분은 번호 순서대로, 그 외는 섞어서
function startQuiz(questions, mode, range, isReview, keepOrder) {
  const seen = loadSeen();
  state = {
    mode, range, isReview: !!isReview, keepOrder: !!keepOrder,
    totalQuestions: questions.length,
    pointsTotal: questions.reduce((s, q) => s + (q.points || 0), 0),
    pointsEarned: 0,
    round: 1,
    queue: keepOrder ? [...questions] : shuffle(questions),
    newIds: new Set(questions.filter(q => !seen[q.id]).map(q => q.id)),
    idx: 0,
    wrongThisRound: [],
    totalAttempts: 0,
    totalCorrect: 0,
    wrongCount: {},
    answered: false
  };
  renderQuestion();
}

function currentQ() { return state.queue[state.idx]; }

// 배점 [n점]은 발문 문장 끝에 붙임 (발문 안에 그림·표가 있으면 그 앞에)
function withPoints(html, points) {
  const pts = `<span class="pts">[${points}점]</span>`;
  const at = html.search(/<(div|table|figure|svg)[\s>]/i);
  return at > 0 ? html.slice(0, at) + pts + html.slice(at) : html + pts;
}

// ===== 문제 화면 =====
function renderQuestion() {
  const q = currentQ();
  const essay = q.type === "서술형";
  state.answered = false;
  state.revealed = false;

  const progress = (state.idx / state.queue.length) * 100;
  const isRetry = state.round > 1;
  const qno = essay ? `[${escapeHtml(q.no)}]` : `${escapeHtml(q.no)}.`;

  app.innerHTML = `
    <div class="top-bar">
      <span class="round-badge ${isRetry ? "retry" : ""}">${isRetry ? `🔁 오답 다시 풀기 (${state.round}차)` : "1차 시험"}</span>
      <button class="btn-restart" id="btn-restart">⟲ 처음부터</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${state.idx + 1} / ${state.queue.length}</div>
    <div class="score-line">
      <span class="sc-ok">⭕ 맞음 ${state.totalCorrect}</span>
      <span class="sc-no">❌ 틀림 ${state.totalAttempts - state.totalCorrect}</span>
    </div>
    <div class="q-box">
      <div class="q-meta">
        <span class="subj-chip" style="background:${SUBJECT_COLORS[q.subject]}">${q.subject}</span>
        <span class="type-chip ${essay ? "essay" : ""}">${q.type}</span>
        ${!isRetry && state.newIds.has(q.id) ? `<span class="new-chip">NEW</span>` : ""}
        <span class="q-topic">${escapeHtml(q.topic)}</span>
      </div>
      ${q.group ? `<div class="q-group">${q.group}</div>` : ""}
      ${q.passage ? `<div class="paper">${q.passage}</div>` : ""}
      <div class="question"><span class="qno">${qno}</span>${withPoints(q.q, q.points)}</div>
      ${q.box ? `<div class="box">${q.boxTitle ? `<div class="box-t">${escapeHtml(q.boxTitle)}</div>` : ""}${q.box}</div>` : ""}
      ${essay ? "" : `<div class="word-hint">알맞은 답을 고르세요 (키보드 1~${q.options.length})</div>`}
    </div>
    ${essay ? `
    <textarea class="write-input" id="write-input" rows="4" placeholder="여기에 답을 쓰거나, 노트에 풀어 보세요"></textarea>
    <div class="write-hint">답을 다 썼으면 아래 버튼을 눌러 모범 답안과 비교해요</div>
    <button class="btn-next" id="btn-reveal">✏️ 다 풀었어요 — 모범 답안 보고 채점하기</button>
    <div id="reveal-area"></div>
    ` : `
    <div class="choices">
      ${q.options.map((o, i) => `
        <button class="choice" data-i="${i}">
          <span class="num">${CIRCLED[i]}</span><span class="txt">${o}</span>
        </button>`).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <div id="explain-area"></div>`}
  `;

  armButton(document.getElementById("btn-restart"), "한 번 더 누르면 처음으로", renderStart);
  if (essay) {
    document.getElementById("btn-reveal").addEventListener("click", revealEssay);
  } else {
    app.querySelectorAll(".choice").forEach(btn =>
      btn.addEventListener("click", () => answer(parseInt(btn.dataset.i))));
  }
  window.scrollTo(0, 0);
}

function recordResult(q, correct) {
  state.totalAttempts++;
  if (state.round === 1) markSeen(q.id);
  if (correct) {
    state.totalCorrect++;
    if (state.round === 1) state.pointsEarned += q.points || 0;
    if (state.round === 1 && state.isReview) bumpWrongStat(q.id, -1);
  } else {
    state.wrongThisRound.push(q);
    state.wrongCount[q.id] = (state.wrongCount[q.id] || 0) + 1;
    if (state.round === 1) bumpWrongStat(q.id, +1);
  }
}

// ===== 선택형 답변 =====
function answer(i) {
  if (state.answered) return;
  state.answered = true;
  const q = currentQ();
  const correct = i === q.answer;
  recordResult(q, correct);

  [...app.querySelectorAll(".choice")].forEach((b, j) => {
    b.disabled = true;
    if (j === q.answer) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback " + (correct ? "ok" : "no");
  fb.textContent = correct ? "⭕ 정답입니다!" : `❌ 틀렸어요! 정답: ${CIRCLED[q.answer]}`;

  const area = document.getElementById("explain-area");
  if (state.mode === "study" || state.round > 1) {
    area.innerHTML = `
      <div class="answer-reveal">
        <div class="answer-label">💡 해설</div>
        <div class="explain-text">${q.explain}</div>
      </div>`;
  }
  const next = document.createElement("button");
  next.className = "btn-next";
  next.id = "btn-next";
  const isLast = state.idx === state.queue.length - 1;
  next.textContent = isLast && state.wrongThisRound.length === 0 ? "결과 보기 →" : "다음 문제 → (Enter)";
  next.addEventListener("click", nextQuestion);
  area.appendChild(next);
  next.focus({ preventScroll: true });
}

// ===== 서술형: 모범 답안 공개 → 스스로 채점 =====
function revealEssay() {
  if (state.revealed) return;
  state.revealed = true;
  const q = currentQ();
  const inp = document.getElementById("write-input");
  const mine = inp.value.trim();
  inp.disabled = true;
  document.getElementById("btn-reveal").style.display = "none";
  document.querySelector(".write-hint").style.display = "none";
  document.getElementById("reveal-area").innerHTML = `
    <div class="answer-reveal">
      ${mine ? `<div class="answer-label">내가 쓴 답</div><div class="mine">${escapeHtml(mine)}</div>` : ""}
      <div class="answer-label">모범 답안</div>
      <div class="model">${q.answer}</div>
      <div class="answer-label">💡 채점 기준 · 해설</div>
      <div class="explain-text">${q.explain}</div>
      <div class="self-check-q">모범 답안과 비교해서 스스로 채점하세요! (핵심 내용과 조건을 지켰으면 ⭕)</div>
      <div class="self-check">
        <button class="btn-self ok" id="btn-self-ok">⭕ 맞았어요 (1)</button>
        <button class="btn-self no" id="btn-self-no">❌ 틀렸어요 (2)</button>
      </div>
    </div>`;
  document.getElementById("btn-self-ok").addEventListener("click", () => selfCheck(true));
  document.getElementById("btn-self-no").addEventListener("click", () => selfCheck(false));
  document.getElementById("btn-self-ok").focus({ preventScroll: true });
}

function selfCheck(correct) {
  if (state.answered || !state.revealed) return;
  state.answered = true;
  recordResult(currentQ(), correct);
  nextQuestion();
}

function nextQuestion() {
  state.idx++;
  if (state.idx < state.queue.length) {
    renderQuestion();
  } else if (state.wrongThisRound.length > 0) {
    state.round++;
    state.queue = state.keepOrder ? [...state.wrongThisRound] : shuffle(state.wrongThisRound);
    state.wrongThisRound = [];
    state.idx = 0;
    renderQuestion();
  } else {
    renderResult();
  }
}

// ===== 결과 화면 =====
function renderResult() {
  const wrongEntries = Object.entries(state.wrongCount).sort((a, b) => b[1] - a[1]);
  const score = state.pointsTotal ? Math.round((state.pointsEarned / state.pointsTotal) * 100) : 0;
  const perfect = wrongEntries.length === 0;

  saveHistoryEntry({
    date: Date.now(), mode: state.mode, range: state.range,
    questions: state.totalQuestions, attempts: state.totalAttempts, correct: state.totalCorrect,
    score, rounds: state.round
  });

  app.innerHTML = `
    <div class="result-emoji">${perfect ? "🏆" : score >= 80 ? "🎉" : "💪"}</div>
    <div class="result-title">${perfect ? "완벽해요! 한 번에 다 맞혔어요!" : "모든 문제를 다 맞혔어요!"}</div>
    <div class="stats">
      <div class="stat"><div class="val">${score}</div><div class="label">점수</div></div>
      <div class="stat"><div class="val" style="color:#27ae60">${state.totalCorrect}</div><div class="label">⭕ 맞음</div></div>
      <div class="stat"><div class="val" style="color:#e74c3c">${state.totalAttempts - state.totalCorrect}</div><div class="label">❌ 틀림</div></div>
      <div class="stat"><div class="val">${state.round}</div><div class="label">라운드</div></div>
    </div>
    <div class="stats-note">점수는 1차 시험에서 맞힌 문제의 배점으로 100점 만점 환산 (${state.pointsEarned} / ${state.pointsTotal}점)</div>
    ${perfect
      ? `<p class="perfect-msg">틀린 문제가 하나도 없어요 👏</p>`
      : `<div class="wrong-list-title">📌 틀렸던 문제 (복습하세요!)</div>
         <div class="wrong-list">
           ${wrongEntries.map(([id, cnt]) => {
             const q = Q_BY_ID[id];
             return `<div class="wrong-item">
               <div class="top"><span class="en">${q.subject} ${escapeHtml(q.no)}번 · ${escapeHtml(q.topic)}</span><span class="cnt">${cnt}회 틀림</span></div>
               <span class="ko">${escapeHtml(plainText(q.q, 60))}</span>
             </div>`;
           }).join("")}
         </div>`}
    <button class="btn-primary" id="btn-again">처음으로 (새 시험지 만들기)</button>
  `;
  document.getElementById("btn-again").addEventListener("click", renderStart);
  window.scrollTo(0, 0);
}

// ===== 키보드 단축키 =====
document.addEventListener("keydown", e => {
  if (!state.queue) return;
  const q = currentQ();
  if (!q) return;
  if (q.type === "서술형") {
    if (document.activeElement && document.activeElement.id === "write-input") return;
    if (state.revealed && !state.answered) {
      if (e.key === "1") selfCheck(true);
      else if (e.key === "2") selfCheck(false);
    }
    return;
  }
  if (e.key >= "1" && e.key <= String(q.options.length) && !state.answered) {
    answer(parseInt(e.key) - 1);
  } else if (e.key === "Enter" && state.answered) {
    const btn = document.getElementById("btn-next");
    if (btn && document.activeElement !== btn) nextQuestion();
  }
});

renderStart();
</script>
